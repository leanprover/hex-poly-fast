name = "hex-poly-fast"
defaultTargets = ["HexPolyFast"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexTruncatedSeries"
git = "https://github.com/leanprover/hex-truncated-series.git"
rev = "v0.8.0"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.8.0"

[[lean_lib]]
name = "HexPolyFast"
